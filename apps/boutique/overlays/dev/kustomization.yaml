apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# DEV desired state for Online Boutique (ADR-0016). Digests from kaveri-boutique CI (release-digests.json).
namespace: kaveri-dev
resources:
  - ../../base
components:
  - ../../components/without-loadgenerator
patches:
  # No public L4 load balancer in DEV; ingress arrives with Gateway API (2.18).
  - patch: |-
      $patch: delete
      apiVersion: v1
      kind: Service
      metadata:
        name: frontend-external
